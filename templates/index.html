<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Viagem Europa 💸</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f0; min-height: 100vh; padding: 1.5rem 1rem; color: #1a1a1a; }
  .container { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 22px; font-weight: 600; margin-bottom: 1.5rem; }
  .card { background: #fff; border-radius: 14px; border: 1px solid #e5e5e0; padding: 1.25rem; margin-bottom: 1rem; }
  .summary-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 1rem; }
  .metric { background: #f5f5f0; border-radius: 10px; padding: 0.875rem 1rem; }
  .metric .label { font-size: 12px; color: #888; margin-bottom: 4px; }
  .metric .value { font-size: 20px; font-weight: 600; }
  .balance { text-align: center; padding: 1rem; border-radius: 12px; margin-bottom: 1rem; }
  .balance.ok { background: #e8f5e9; border: 1px solid #a5d6a7; }
  .balance.ok .txt { color: #2e7d32; font-weight: 600; font-size: 15px; }
  .balance.owes { background: #fff; border: 1px solid #e5e5e0; }
  .balance.owes .txt { color: #1a1a1a; font-weight: 600; font-size: 15px; }
  .balance .sub { font-size: 13px; color: #888; margin-top: 4px; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
  label { font-size: 13px; color: #666; display: block; margin-bottom: 5px; }
  input, select { width: 100%; padding: 9px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; background: #fafaf8; outline: none; }
  input:focus, select:focus { border-color: #999; }
  .btn { width: 100%; padding: 10px; background: #1a1a1a; color: #fff; border: none; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; margin-top: 4px; }
  .btn:hover { background: #333; }
  .btn:disabled { background: #ccc; cursor: default; }
  .section-title { font-size: 14px; font-weight: 600; color: #666; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.05em; }
  .expense-item { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid #f0f0ec; }
  .expense-item:last-child { border-bottom: none; }
  .avatar { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; flex-shrink: 0; }
  .av-0 { background: #e8f0fe; color: #1a56db; }
  .av-1 { background: #fde8f0; color: #c41754; }
  .exp-info { flex: 1; min-width: 0; }
  .exp-desc { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .exp-meta { font-size: 12px; color: #999; margin-top: 2px; }
  .exp-amount { font-size: 15px; font-weight: 600; white-space: nowrap; }
  .del { background: none; border: none; cursor: pointer; color: #ccc; font-size: 18px; padding: 4px; line-height: 1; }
  .del:hover { color: #e53935; }
  .empty { text-align: center; padding: 2rem; color: #bbb; font-size: 14px; }
  .names-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 1rem; }
</style>
</head>
<body>
<div class="container">
  <h1>💸 despesas da viagem</h1>

  <div class="card">
    <div class="names-row">
      <div>
        <label>seu nome</label>
        <input type="text" id="name0" value="Sérgio" oninput="saveNames(); render()">
      </div>
      <div>
        <label>nome dela</label>
        <input type="text" id="name1" value="Ana" oninput="saveNames(); render()">
      </div>
    </div>
  </div>

  <div class="summary-grid" id="summary"></div>
  <div id="balance"></div>

  <div class="card">
    <div class="section-title" style="margin-bottom:14px">adicionar despesa</div>
    <div class="form-row">
      <div>
        <label>descrição</label>
        <input type="text" id="inp-desc" placeholder="hotel, jantar...">
      </div>
      <div>
        <label>valor (€)</label>
        <input type="number" id="inp-val" min="0" step="0.01" placeholder="0,00">
      </div>
    </div>
    <div style="margin-bottom:10px">
      <label>quem pagou</label>
      <select id="inp-who"></select>
    </div>
    <button class="btn" id="add-btn" onclick="addExpense()">+ adicionar</button>
  </div>

  <div class="card" id="list-card">
    <div class="section-title">despesas</div>
    <div id="list"><div class="empty">nenhuma despesa ainda</div></div>
  </div>
</div>

<script>
let expenses = [];

function names() {
  return [
    document.getElementById('name0').value.trim() || 'Pessoa 1',
    document.getElementById('name1').value.trim() || 'Pessoa 2'
  ];
}

function initials(n) { return n.split(' ').map(w=>w[0]).join('').substring(0,2).toUpperCase(); }

function saveNames() {
  const [n0, n1] = names();
  localStorage.setItem('name0', n0);
  localStorage.setItem('name1', n1);
}

function fmt(v) { return '€ ' + parseFloat(v).toFixed(2).replace('.', ','); }

function updateSelect() {
  const sel = document.getElementById('inp-who');
  const cur = sel.value;
  const [n0, n1] = names();
  sel.innerHTML = `<option value="0">${n0}</option><option value="1">${n1}</option>`;
  if (cur === '1') sel.value = '1';
}

async function load() {
  const res = await fetch('/expenses');
  expenses = await res.json();
  render();
}

async function addExpense() {
  const desc = document.getElementById('inp-desc').value.trim();
  const val = parseFloat(document.getElementById('inp-val').value);
  const who = document.getElementById('inp-who').value;
  if (!desc || isNaN(val) || val <= 0) return;
  const btn = document.getElementById('add-btn');
  btn.disabled = true;
  btn.textContent = 'salvando...';
  const [n0, n1] = names();
  await fetch('/expenses', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ description: desc, amount: val, paid_by: who === '0' ? n0 : n1 })
  });
  document.getElementById('inp-desc').value = '';
  document.getElementById('inp-val').value = '';
  btn.disabled = false;
  btn.textContent = '+ adicionar';
  await load();
}

async function deleteExpense(id) {
  await fetch(`/expenses/${id}`, { method: 'DELETE' });
  await load();
}

function render() {
  const [n0, n1] = names();
  updateSelect();

  const total0 = expenses.filter(e => e.paid_by === n0).reduce((s,e) => s + parseFloat(e.amount), 0);
  const total1 = expenses.filter(e => e.paid_by === n1).reduce((s,e) => s + parseFloat(e.amount), 0);
  const total = total0 + total1;
  const diff = total0 - total1;

  document.getElementById('summary').innerHTML = `
    <div class="metric"><div class="label">total</div><div class="value">${fmt(total)}</div></div>
    <div class="metric"><div class="label">${n0}</div><div class="value">${fmt(total0)}</div></div>
    <div class="metric"><div class="label">${n1}</div><div class="value">${fmt(total1)}</div></div>
  `;

  const bc = document.getElementById('balance');
  if (total === 0) { bc.innerHTML = ''; }
  else if (Math.abs(diff) < 0.01) {
    bc.innerHTML = `<div class="balance ok"><div class="txt">✓ tudo equilibrado!</div><div class="sub">vocês gastaram o mesmo</div></div>`;
  } else {
    const devedor = diff > 0 ? n1 : n0;
    const credor = diff > 0 ? n0 : n1;
    const valor = fmt(Math.abs(diff / 2));
    bc.innerHTML = `<div class="balance owes"><div class="txt">${devedor} deve pagar ${valor} para ${credor}</div><div class="sub">para ficarem quites</div></div>`;
  }

  const list = document.getElementById('list');
  if (expenses.length === 0) {
    list.innerHTML = '<div class="empty">nenhuma despesa ainda</div>';
  } else {
    list.innerHTML = expenses.slice().reverse().map(e => {
      const idx = e.paid_by === n1 ? 1 : 0;
      return `<div class="expense-item">
        <div class="avatar av-${idx}">${initials(e.paid_by)}</div>
        <div class="exp-info">
          <div class="exp-desc">${e.description}</div>
          <div class="exp-meta">pago por ${e.paid_by}</div>
        </div>
        <div class="exp-amount">${fmt(e.amount)}</div>
        <button class="del" onclick="deleteExpense('${e.id}')" title="remover">×</button>
      </div>`;
    }).join('');
  }
}

const saved0 = localStorage.getItem('name0');
const saved1 = localStorage.getItem('name1');
if (saved0) document.getElementById('name0').value = saved0;
if (saved1) document.getElementById('name1').value = saved1;

load();
setInterval(load, 15000);
</script>
</body>
</html>
